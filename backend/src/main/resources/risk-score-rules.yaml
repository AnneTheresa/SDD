risk-score:
  version: 1.0
  insufficientConditions:
    minMonths: 3
  riskScoreBands:
    - { max: 25, level: LOW, overallExplain: "healthy financial position" }
    - {
        max: 45,
        level: MODERATE,
        overallExplain: "generally stable with minor concerns",
      }
    - {
        max: 70,
        level: ELEVATED,
        overallExplain: "financial strain, needs attention",
      }
    - {
        max: 100,
        level: HIGH,
        overallExplain: "high risk, immediate action recommended",
      }

  factors:
    SPENDING_INCOME_RATIO:
      weight: 0.5
      bands:
        - { max: 0.5, score: 10, explain: healthy }
        - { max: 0.7, score: 20, explain: comfortable }
        - { max: 0.9, score: 35, explain: tight }
        - { max: 1.0, score: 60, explain: danger }
        - { max: 9999, score: 100, explain: spending more than earning }
    # months of spend convered
    SAVING_BALANCE:
      weight: 0.35
      bands:
        - { max: 0.25, score: 100, explain: no buffer }
        - { max: 1, score: 90, explain: very thin }
        - { max: 3, score: 60, explain: thin }
        - { max: 6, score: 20, explain: adequate }
        - { max: 9999, score: 10, explain: strong }
    # Saving goals:
    GOAL_PROGRESS:
      weight: 0.15
      bands:
        - { max: 10, score: 100, explain: barely started }
        - { max: 30, score: 80, explain: early }
        - { max: 60, score: 50, explain: on track }
        - { max: 90, score: 25, explain: nearly there }
        - { max: 99.9, score: 15, explain: almost there }
        - { max: 100, score: 10, explain: goal met }
